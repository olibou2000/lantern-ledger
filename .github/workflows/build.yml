name: Build app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build-app
  cancel-in-progress: true

jobs:
  website:
    name: Publish web app (GitHub Pages)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --omit=dev
      - run: npm run vendor
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: www
      - id: deploy
        uses: actions/deploy-pages@v4

  android:
    name: Build Android app (APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install
      - run: npm run vendor
      - run: npx cap add android
      - name: Generate app icon and splash screen
        run: npx capacitor-assets generate --android
        continue-on-error: true
      - run: npx cap sync android
      - name: Use the app's fixed signing key (so new builds install as updates)
        run: mkdir -p ~/.android && cp signing/debug.keystore ~/.android/debug.keystore
      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk storyverse-tracker.apk
      - uses: actions/upload-artifact@v4
        with:
          name: storyverse-tracker-apk
          path: storyverse-tracker.apk
      - name: Publish to the Releases page
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest storyverse-tracker.apk \
            --title "Storyverse Tracker (latest build)" \
            --notes "Built from commit ${GITHUB_SHA::7}. On your Android phone, download storyverse-tracker.apk below and open it to install."
